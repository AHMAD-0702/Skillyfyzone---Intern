<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Status Green Glow -->
    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#00C853" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="70" rx="8" ry="8" fill="url(#barBg)" stroke="#30363D" stroke-width="1"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="2" rx="1" fill="url(#progressGrad)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ SECTION 1: LIVE STATUS INDICATOR ═══ -->
  <g transform="translate(30, 35)">
    <!-- Outer Pulse Ring -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00C853" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Solid Dot -->
    <circle cx="0" cy="0" r="5" fill="#00C853" filter="url(#softGlow)">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Live Status Text -->
  <text x="55" y="41" font-family="'Fira Code', monospace" font-size="13" font-weight="bold"
    fill="#00C853" filter="url(#textGlow)">
    ● LIVE
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="130" y1="18" x2="130" y2="52" stroke="#30363D" stroke-width="1" opacity="0.6"/>

  <!-- ═══ SECTION 2: SCROLLING TICKER ═══ -->
  <g>
    <text font-family="'Fira Code', monospace" font-size="13" font-weight="bold"
      fill="#36BCF7" filter="url(#textGlow)" y="41">
      <animate attributeName="x"
        values="140;140;-1200;140"
        dur="16s" repeatCount="indefinite"/>
      📊 Data Preprocessing · 🔧 Feature Engineering · 🤖 Model Training · 📈 Evaluation · 🚀 Deployment · ✅ All Tasks Completed
    </text>
  </g>

  <!-- Blinking Cursor after ticker -->
  <rect x="140" y="26" width="3" height="18" fill="#36BCF7" opacity="0.9">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="820" y1="18" x2="820" y2="52" stroke="#30363D" stroke-width="1" opacity="0.6"/>

  <!-- ═══ SECTION 3: BUILD/PROGRESS METER ═══ -->
  <g transform="translate(840, 25)">
    <text x="0" y="12" font-family="'Fira Code', monospace" font-size="11"
      fill="#8A2BE2" font-weight="bold">
      PROGRESS
    </text>

    <!-- Background Bar -->
    <rect x="0" y="18" width="180" height="8" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.5"/>

    <!-- Animated Progress Fill (100%) -->
    <rect x="0" y="18" width="180" height="8" rx="4" fill="url(#progressGrad)">
      <animate attributeName="width" values="0;180;180" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Shine Sweep Effect -->
    <rect x="0" y="18" width="40" height="8" rx="4" fill="#ffffff" opacity="0.3">
      <animate attributeName="x" values="0;180;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- 100% Text -->
    <text x="185" y="26" font-family="'Fira Code', monospace" font-size="11"
      fill="#00C853" font-weight="bold">
      100%
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="1050" y1="18" x2="1050" y2="52" stroke="#30363D" stroke-width="1" opacity="0.6"/>

  <!-- ═══ SECTION 4: TASK COUNTER ═══ -->
  <g transform="translate(1070, 25)">
    <text x="0" y="10" font-family="'Fira Code', monospace" font-size="10"
      fill="#FF6D00" font-weight="bold" opacity="0.9">
      TASKS
    </text>
    <text x="0" y="28" font-family="'Fira Code', monospace" font-size="16"
      fill="#FF0080" font-weight="bold" filter="url(#textGlow)">
      04/04
      <animate attributeName="fill" values="#FF0080;#8A2BE2;#36BCF7;#FF0080" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ═══ BOTTOM ACCENT LINE ═══ -->
  <rect x="0" y="68" width="1200" height="2" rx="1" fill="url(#progressGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ LEFT CORNER DECORATION ═══ -->
  <circle cx="8" cy="8" r="3" fill="#FF5F56"/>
  <circle cx="20" cy="8" r="3" fill="#FFBD2E"/>
  <circle cx="32" cy="8" r="3" fill="#27C93F"/>

  <!-- ═══ SCANNING LINE EFFECT ═══ -->
  <rect x="0" y="0" width="2" height="70" fill="#36BCF7" opacity="0.5">
    <animate attributeName="x" values="0;1200;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>