## 🎨 FILE 2: `assets/header.svg`

Create a new file at `assets/header.svg` with this code:

```xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#8A2BE2;#FF0080;#36BCF7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#FF0080;#36BCF7;#8A2BE2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF0080">
        <animate attributeName="stop-color" values="#FF0080;#36BCF7;#8A2BE2;#FF0080" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- Animated Grid Pattern -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="220" fill="url(#grid)"/>
  </g>

  <!-- Floating Particles -->
  <g fill="#ffffff" opacity="0.6" filter="url(#glow)">
    <circle cx="100" cy="50" r="3">
      <animate attributeName="cy" values="50;180;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="100" r="2">
      <animate attributeName="cy" values="100;20;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="3">
      <animate attributeName="cy" values="150;60;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="2">
      <animate attributeName="cy" values="80;170;80" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="120" r="3">
      <animate attributeName="cy" values="120;40;120" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="60" r="2">
      <animate attributeName="cy" values="60;160;60" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Title -->
  <text x="600" y="95" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="52" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Skillyfyzone Internship
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="135" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#ffffff" opacity="0.9">
    🚀 Machine Learning · Data Science · AI
  </text>

  <!-- Animated Cursor -->
  <rect x="745" y="118" width="3" height="22" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom Wave -->
  <path d="M0,180 Q300,140 600,180 T1200,180 L1200,220 L0,220 Z" fill="#0D1117" opacity="0.4">
    <animate attributeName="d" 
      values="M0,180 Q300,140 600,180 T1200,180 L1200,220 L0,220 Z;
              M0,180 Q300,220 600,180 T1200,180 L1200,220 L0,220 Z;
              M0,180 Q300,140 600,180 T1200,180 L1200,220 L0,220 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
</svg>